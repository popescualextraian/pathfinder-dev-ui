<!DOCTYPE html><html><head><meta charset="utf-8"><title>Backlog item 10 - sidebar mockup</title>
<style>
:root{--msg-red:#a01441;--msg-red-light:#c4356a;--ink:#1d1d2b;--paper:#fff;--gold:#d9a441}
*{box-sizing:border-box}body{margin:0;padding:24px;font-family:'Segoe UI',Roboto,Arial,sans-serif;background:#f1eef0;display:flex;gap:32px;align-items:flex-start}
figure{margin:0}figcaption{font-weight:600;margin-bottom:8px;color:#333}
.sb{width:240px;min-height:640px;background:var(--ink);color:var(--paper);padding-bottom:16px;border-radius:8px;display:flex;flex-direction:column}
.brand{display:flex;align-items:center;gap:10px;padding:16px;font-weight:600;font-size:16px}
.logo{width:28px;height:28px;background:var(--msg-red);border-radius:6px;display:inline-flex;align-items:center;justify-content:center;font:700 12px monospace}
.btn{margin:0 16px 8px;padding:9px;background:var(--msg-red);border-radius:8px;text-align:center;font-weight:600;font-size:14px}
.k{margin:18px 16px 6px;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:rgba(255,255,255,.55);font-weight:600}
.old .i{padding:7px 18px;font-size:14px}.old .i.a{font-weight:600}.old .i.o{opacity:.75;font-size:14px}
.n{display:flex;align-items:center;gap:10px;margin:2px 8px;padding:9px 10px;border-radius:8px;font-size:15px}
.n .ic{width:18px;text-align:center;opacity:.8}.n .c{margin-left:auto;font-size:12px;background:rgba(255,255,255,.14);padding:1px 8px;border-radius:99px}
.n.a{background:rgba(255,255,255,.14);box-shadow:inset 3px 0 0 var(--msg-red-light);font-weight:600}
.sub{margin:0 8px 0 36px}.sub div{display:flex;justify-content:space-between;padding:5px 10px;font-size:13.5px;border-radius:6px;color:rgba(255,255,255,.8)}
.sub .s{background:rgba(255,255,255,.1);color:#fff}.sub span{font-size:12px;color:rgba(255,255,255,.6)}
.sp{flex:1}.foot{border-top:1px solid rgba(255,255,255,.12);margin:12px 8px 0;padding-top:8px}
</style></head><body>
<figure class="old"><figcaption>Today</figcaption><div class="sb old">
<div class="brand"><span class="logo">&gt;_</span>pathfinder</div><div class="btn">+ New task</div>
<div class="k">Repositories</div><div class="i">All &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;12</div><div class="i">repo-a &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;3</div><div class="i">repo-b &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;1</div>
<div class="k">Show</div><div class="i a">Tasks</div><div class="i o">Backlog</div><div class="i o">Workflows</div></div></figure>
<figure><figcaption>Proposed (on Tasks)</figcaption><div class="sb">
<div class="brand"><span class="logo">&gt;_</span>pathfinder</div><div class="btn">+ New task</div>
<div class="k">Work</div>
<div class="n"><span class="ic">▤</span>Backlog<span class="c">8</span></div>
<div class="n a"><span class="ic">▶</span>Tasks<span class="c">12</span></div>
<div class="sub"><div class="s">All repositories<span>12</span></div><div>repo-a<span>3</span></div><div>repo-b<span>1</span></div></div>
<div class="k">Automate</div>
<div class="n"><span class="ic">⇄</span>Workflows</div>
<div class="n"><span class="ic">◷</span>Schedules</div>
<div class="k">Team</div>
<div class="n"><span class="ic">☺</span>Colleagues</div>
<div class="sp"></div><div class="foot"><div class="n"><span class="ic">⚙</span>Settings</div></div></div>
<p style="max-width:240px;font-size:12px;color:#666">Schedules and Colleagues appear only once they exist.</p></figure>
</body></html>
