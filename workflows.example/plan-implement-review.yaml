# Example workflow for the lanes of backlog.example.yaml (stage = lane id). Copy into WORKFLOWS_DIR.
# The file name without extension is the workflow id.
title: Plan, implement, review
steps:
  - id: plan
    title: Plan
    stage: plan                     # the card moves to this lane when the step starts
    sessions:
      - name: main                  # first session of the first step is the task's main session
        prompt: |
          You plan backlog item #{{item.id}}: {{item.title}}
          {{item.description}}
          Use superpowers:brainstorming with the human, then write the plan to plans/{{item.id}}.md.
    gate: human                     # human: wait for "Continue"; auto: go on when the sessions are done
    exitPrompt: Make sure the plan is complete in plans/{{item.id}}.md and committed.
  - id: implement
    title: Implement
    stage: in-progress
    requires:                       # block list: a flow list [plans/{{item.id}}.md] is not valid YAML
      - "plans/{{item.id}}.md"
    sessions:
      - name: impl
        prompt: Implement plans/{{item.id}}.md, subagent-driven and test-first. Commit per step.
    gate: auto
  - id: review
    title: Review
    stage: review
    sessions:
      - name: review
        fork: impl                  # optional: start as a copy of that session's conversation
        model: sonnet               # optional
        prompt: Review the branch against plans/{{item.id}}.md and fix what is real.
    gate: human
doneStage: done                     # optional: where the card goes when the workflow ends
